name: Sync main into submains

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [ctrl, algo, infra]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create PR from main into target (always)
        id: create_pr
        run: |
          TARGET=${{ matrix.target }}
          API_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls"
          TITLE="chore: sync main → ${TARGET}"
          BODY="自動生成: main の最新を取り込みます\n\nコンフリクトがある場合はこの PR 上で手動で解消してください。"
          PAYLOAD=$(printf '{"title":"%s","head":"%s","base":"%s","body":"%s"}' "$TITLE" "main" "$TARGET" "$BODY")
          HTTP_STATUS=$(curl -s -o /tmp/response -w "%{http_code}" -X POST -H "Authorization: token ${GITHUB_TOKEN}" -H "Accept: application/vnd.github.v3+json" "$API_URL" -d "$PAYLOAD")
          if [ "$HTTP_STATUS" -eq 201 ]; then
            echo "created_pr=1" >> $GITHUB_OUTPUT
            cat /tmp/response
          else
            # 422 is returned when a PR already exists; show response for debugging
            echo "created_pr=0" >> $GITHUB_OUTPUT
            echo "http_status=$HTTP_STATUS"
            cat /tmp/response
          fi
