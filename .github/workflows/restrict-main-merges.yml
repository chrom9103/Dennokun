name: Restrict main merges to submains

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  validate-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Allow only ctrl, algo, infra
        shell: bash
        run: |
          allowed_branches=(ctrl algo infra)
          source_branch='${{ github.event.pull_request.head.ref }}'

          for branch in "${allowed_branches[@]}"; do
            if [[ "$source_branch" == "$branch" ]]; then
              echo "Allowed source branch: $source_branch"
              exit 0
            fi
          done

          echo "This PR cannot be merged into main from '$source_branch'."
          echo "Allowed branches: ctrl, algo, infra."
          exit 1
