apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dennokun-ingress
spec:
  ingressClassName: public
  rules:
    - host: dennokun.chrom.jp
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dennokun-frontend-service
                port:
                  number: 3001
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: dennokun-backend-service
                port:
                  number: 8001
  tls:
    - hosts:
        - dennokun.chrom.jp
      secretName: dennokun-secret
