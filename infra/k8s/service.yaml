apiVersion: v1
kind: Service
metadata:
  name: dennokun-backend-service
spec:
  selector:
    app: dennokun-backend
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
  type: ClusterIP

---

apiVersion: v1
kind: Service
metadata:
  name: dennokun-frontend-service
spec:
  selector:
    app: dennokun-frontend
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
  type: ClusterIP

---

# DNS alias service for frontend Next.js upstream 'backend'
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: dennokun-backend
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
  type: ClusterIP
