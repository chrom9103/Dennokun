services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: denno
      POSTGRES_PASSWORD: dennopass
      POSTGRES_DB: dennodb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - denno_net

  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    env_file:
      - backend/.env
    depends_on:
      - postgres
    ports:
      - "8001:8001"
    networks:
      - denno_net

  frontend:
    build:
      context: .
      dockerfile: infra/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001}
    env_file:
      - frontend/.env
    ports:
      - "3001:3001"
    depends_on:
      - backend
    networks:
      - denno_net

volumes:
  postgres_data:

networks:
  denno_net:
    driver: bridge
